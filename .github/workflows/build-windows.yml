name: Build Windows Custom

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows SolidCraft Executable
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build SolidCraft Release
        run: |
          cargo build --release -p solidcraft

      - name: Upload SolidCraft Binary
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-windows-custom
          path: target/release/solidcraft.exe
          if-no-files-found: error
